server.port=8092
spring.application.name=minecraft-wrapper

# Minecraft server configuration
minecraft.server.jar=${MINECRAFT_SERVER_JAR:/mcserver/spigot-1.21.10.jar}
minecraft.server.directory=${MINECRAFT_SERVER_DIRECTORY:/mcserver}
minecraft.java.opts=${JAVA_OPTS:--Xmx2G -Xms1G}
minecraft.auto.start=${MINECRAFT_AUTO_START:true}
minecraft.auto.restart=${MINECRAFT_AUTO_RESTART:false}

# Alert manager configuration
alert.manager.url=${ALERT_MANAGER_URL:http://alert-manager:8090/api/alerts}
alerts.server.start=${ALERTS_SERVER_START:true}
alerts.server.stop=${ALERTS_SERVER_STOP:true}
alerts.server.crash=${ALERTS_SERVER_CRASH:true}

# Plugin deployment
# Token required in the Authorization: Bearer <token> header to use POST /api/plugins/deploy.
# Leave empty (default) to disable the endpoint entirely.
deploy.auth.token=${DEPLOY_AUTH_TOKEN:}
plugins.directory=${PLUGINS_DIRECTORY:/mcserver/plugins}
# Allow JARs up to 100 MB (Spring Boot defaults to 1 MB / 10 MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Diagnostic log access (disabled by default for security)
logs.diagnostic.enabled=${LOGS_DIAGNOSTIC_ENABLED:false}
logs.diagnostic.max-lines=${LOGS_DIAGNOSTIC_MAX_LINES:100}

# Logging
logging.level.com.openmc.minecraftwrapper=INFO
