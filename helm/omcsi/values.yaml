# =============================================================================
# Open Minecraft Server Infrastructure – Helm values
# =============================================================================
# Most application-level variables from sample.env have a corresponding entry
# below. Some values are intentionally fixed or computed in the templates
# (e.g., DATA_STORAGE_PATH is hardcoded to match the PVC mount, internal
# service URLs like ALERT_MANAGER_URL/WEBAPP_URL/BACKUP_MANAGER_URL are
# derived from Helm helpers, and RCON port references are sourced from
# minecraftWrapper.internalService.rconPort). Docker Compose-only variables
# (container names, host port mappings, and volume names) are also excluded —
# Kubernetes manages these natively via Deployment names, Service specs, and
# PVC names.
#
# Sensitive values are placed under the `secrets` key and stored in a k8s
# Secret. Override them via --set or a separate values file.
# =============================================================================

# ---------------------------------------------------------------------------
# Global / Shared
# ---------------------------------------------------------------------------
global:
  # Namespace is normally set by --namespace; this is informational only.
  namespace: ""

# ---------------------------------------------------------------------------
# Minecraft Server + Wrapper
# ---------------------------------------------------------------------------
minecraftWrapper:
  image:
    repository: dmccoystephenson/open-mc-server
    tag: latest
    pullPolicy: IfNotPresent
  # replicaCount is fixed at 1 — a single Minecraft server instance must own
  # the world data exclusively.  The value is hardcoded in the template.
  resources:
    requests:
      cpu: "500m"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  service:
    # External service exposes only the Minecraft game port.
    type: NodePort
    minecraftPort: 25565
  # Internal ClusterIP service for RCON, BlueMap, and wrapper API.
  internalService:
    rconPort: 25575
    bluemapPort: 8100
    wrapperPort: 8092
  env:
    MINECRAFT_VERSION: "1.21.10"
    OPERATOR_UUID: "YOUR_UUID_HERE"
    OPERATOR_NAME: "YOUR_USERNAME_HERE"
    OPERATOR_LEVEL: "4"
    OVERWRITE_EXISTING_SERVER: "false"
    SERVER_MOTD: "An Open Minecraft Server"
    MAX_PLAYERS: "20"
    DIFFICULTY: "normal"
    GAMEMODE: "survival"
    PVP_ENABLED: "true"
    ONLINE_MODE: "true"
    JAVA_OPTS: "-Xmx6G -Xms4G"
    PLUGINS_DIRECTORY: "/mcserver/plugins"
    # Alert toggles
    ALERTS_SERVER_START: "true"
    ALERTS_SERVER_STOP: "true"
    ALERTS_SERVER_CRASH: "true"
    ALERTS_CONFIG_WARNING: "false"
    ALERTS_PLUGIN_DEPLOY: "true"
    ALERTS_UPGRADE_START: "true"
    ALERTS_UPGRADE_COMPLETE: "true"
    ALERTS_UPGRADE_FAILURE: "true"
    # Diagnostic log access
    LOGS_DIAGNOSTIC_ENABLED: "false"
    LOGS_DIAGNOSTIC_MAX_LINES: "100"

# ---------------------------------------------------------------------------
# Web Application (Dashboard)
# ---------------------------------------------------------------------------
webapp:
  image:
    repository: dmccoystephenson/open-mc-server-webapp
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  env:
    MC_MOTD: "An Open Minecraft Server"
    MC_MAX_PLAYERS: "20"
    DYNMAP_URL: ""
    BLUEMAP_URL: ""
    WEB_REFRESH_INTERVAL_MS: "1800000"
    ACTIVITY_TRACKER_URL: ""
    ACTIVITY_TRACKER_ENABLED: "false"
    DASHBOARD_TITLE: "Minecraft Server Dashboard"
    DASHBOARD_SUBTITLE: "Server Management & Information"
    DASHBOARD_PRIMARY_COLOR: "#667eea"
    DASHBOARD_SECONDARY_COLOR: "#764ba2"
    ALERT_MANAGER_ENABLED: "true"
    ACCORDION_CHAT_URL: ""

# ---------------------------------------------------------------------------
# Nginx Reverse Proxy
# ---------------------------------------------------------------------------
nginx:
  image:
    repository: dmccoystephenson/open-mc-server-nginx
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: 64Mi
    limits:
      cpu: "200m"
      memory: 128Mi
  service:
    type: LoadBalancer
    httpPort: 80
    httpsPort: 443
  tls:
    # When true, a self-signed certificate is generated via an init container
    # (same behaviour as the Docker Compose setup).
    # Set to false and supply a kubernetes.io/tls Secret named
    # {{ include "omcsi.fullname" . }}-nginx-tls (typically <release>-nginx-tls
    # when the release name already contains "omcsi", otherwise
    # <release>-omcsi-nginx-tls). The Secret's tls.crt / tls.key are mapped
    # to the cert.pem / key.pem paths that nginx expects.
    selfSigned: true

# ---------------------------------------------------------------------------
# Backup Manager
# ---------------------------------------------------------------------------
backupManager:
  image:
    repository: dmccoystephenson/open-mc-server-backup-manager
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8091
  env:
    BACKUP_DIRECTORY: "/backups"
    BACKUP_MAX_SIZE_MB: "10240"
    # Cron expression: seconds minutes hours day-of-month month day-of-week
    # Default: 2:00 AM every day (server/container local time)
    BACKUP_SCHEDULE: "0 0 2 * * ?"
    SPRING_TASK_SCHEDULING_ENABLED: "true"
    SOURCE_DIRECTORY: "/mcserver"
    ALERTS_BACKUP_SUCCESS: "true"
    ALERTS_BACKUP_FAILURE: "true"

# ---------------------------------------------------------------------------
# Alert Manager
# ---------------------------------------------------------------------------
alertManager:
  image:
    repository: dmccoystephenson/open-mc-server-alert-manager
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8090
  env:
    DISCORD_ENABLED: "false"
    MINECRAFT_RCON_ENABLED: "true"

# ---------------------------------------------------------------------------
# Agent Manager (Discord AI bot)
# ---------------------------------------------------------------------------
agentManager:
  enabled: false
  image:
    repository: dmccoystephenson/open-mc-server-agent-manager
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8093
  env:
    # Defaults to true so that enabling the agent-manager Deployment
    # (agentManager.enabled=true) also activates the bot. Override to "false"
    # to deploy the pod without starting the agent.
    AGENT_ENABLED: "true"
    AGENT_START_SERVER_REQUIRES_CONFIRMATION: "true"
    AGENT_STOP_SERVER_REQUIRES_CONFIRMATION: "true"
    AGENT_RESTART_SERVER_REQUIRES_CONFIRMATION: "true"
    AGENT_TRIGGER_BACKUP_REQUIRES_CONFIRMATION: "true"
    DIAGNOSTICS_WEBAPP_ENABLED: "false"
    DIAGNOSTICS_LOGS_ENABLED: "false"
    DIAGNOSTICS_LOGS_MAX_LINES: "500"
    DIAGNOSTICS_LOGS_ANONYMIZE: "true"

# ---------------------------------------------------------------------------
# Secrets – sensitive values stored in a k8s Secret
# rconPassword and adminPassword are required; install will fail if not set.
# Override via --set secrets.rconPassword=xxx or a separate values file.
# ---------------------------------------------------------------------------
secrets:
  rconPassword: ""
  adminUsername: "admin"
  adminPassword: ""
  deployAuthToken: ""
  deploymentAuthToken: ""
  discordWebhookUrl: ""
  agentDiscordBotToken: ""
  agentDiscordChannelId: ""
  agentAnthropicApiKey: ""

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence:
  # Leave storageClass empty to use the cluster default StorageClass.
  # Override with a provider-specific value (for example via a custom values
  # file or --set) when required by your environment (e.g., "gp2" on AWS,
  # "standard" on minikube, "linode-block-storage-retain" on Linode).
  mcserver:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  webappData:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  alertManagerData:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  backups:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
