suite: backup-manager
templates:
  - templates/backup-manager.yaml
set:
  secrets.rconPassword: ci
  secrets.adminPassword: ci
tests:
  - it: Deployment is the first document
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 0

  - it: liveness probe monitors /actuator/health
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /actuator/health
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
        documentIndex: 0

  - it: readiness probe monitors /actuator/health
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /actuator/health
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 30
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
        documentIndex: 0

  - it: mounts mcserver read-only and backups volumes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mcserver
            mountPath: /mcserver
            readOnly: true
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: backups
            mountPath: /backups
        documentIndex: 0

  - it: service is ClusterIP on port 8091
    asserts:
      - isKind:
          of: Service
        documentIndex: 1
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 8091
        documentIndex: 1

  - it: backup schedule env var is set from values
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_SCHEDULE
            value: "0 0 2 * * ?"
        documentIndex: 0

  - it: backup schedule env var is omitted when empty string
    set:
      backupManager.env.BACKUP_SCHEDULE: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_SCHEDULE
          any: true
        documentIndex: 0

  # "-" is Spring's Scheduled.CRON_DISABLED marker — the only supported way to turn
  # the scheduled backup off, since @EnableScheduling cannot be disabled by a property.
  - it: backup schedule env var passes through the "-" disabled marker
    set:
      backupManager.env.BACKUP_SCHEDULE: "-"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_SCHEDULE
            value: "-"
        documentIndex: 0

  # SPRING_TASK_SCHEDULING_ENABLED is not a Spring Boot property; it never disabled
  # anything, so it must not be rendered as though it were a supported knob.
  - it: does not render the non-functional SPRING_TASK_SCHEDULING_ENABLED knob
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_TASK_SCHEDULING_ENABLED
          any: true
        documentIndex: 0

  # The newest backup is never deleted to satisfy the cap, so a cap below one
  # backup's size means only ever holding that single backup. Both the cap and
  # the volume have to move with the world.
  - it: renders the backup size cap at its default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_MAX_SIZE_MB
            value: "10240"
        documentIndex: 0

  - it: honours a raised backup size cap
    set:
      backupManager.env.BACKUP_MAX_SIZE_MB: "61440"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKUP_MAX_SIZE_MB
            value: "61440"
        documentIndex: 0
