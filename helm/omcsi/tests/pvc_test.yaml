suite: PersistentVolumeClaims
templates:
  - templates/pvc.yaml
set:
  secrets.rconPassword: ci
  secrets.adminPassword: ci
  secrets.postgresPassword: ci
tests:
  - it: renders five PVCs when all persistence is enabled (default, postgres enabled)
    asserts:
      - hasDocuments:
          count: 5

  - it: mcserver PVC uses ReadWriteOnce and 10Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 0
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
        documentIndex: 0

  - it: mcserver PVC has no storageClassName when storageClass is empty (uses cluster default)
    asserts:
      - isNull:
          path: spec.storageClassName
        documentIndex: 0

  - it: mcserver PVC sets storageClassName when a storageClass is provided
    set:
      persistence.mcserver.storageClass: linode-block-storage-retain
    asserts:
      - equal:
          path: spec.storageClassName
          value: linode-block-storage-retain
        documentIndex: 0

  - it: webappData PVC uses ReadWriteOnce and 1Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 1
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        documentIndex: 1
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        documentIndex: 1

  - it: backups PVC uses ReadWriteOnce and 20Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 3
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        documentIndex: 3
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi
        documentIndex: 3

  - it: postgres-data PVC uses ReadWriteOnce and 5Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 4
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        documentIndex: 4
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
        documentIndex: 4

  - it: renders four PVCs when postgres is disabled
    set:
      postgres.enabled: "false"
    asserts:
      - hasDocuments:
          count: 4
