apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omcsi.fullname" . }}-backup-manager
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 4 }}
spec:
  replicas: {{ .Values.backupManager.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omcsi.labels" . | nindent 8 }}
        {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 8 }}
    spec:
      {{- include "omcsi.mcserverAffinity" . | nindent 6 }}
      containers:
        - name: backup-manager
          image: "{{ .Values.backupManager.image.repository }}:{{ .Values.backupManager.image.tag }}"
          imagePullPolicy: {{ .Values.backupManager.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: BACKUP_DIRECTORY
              value: {{ .Values.backupManager.env.BACKUP_DIRECTORY | quote }}
            - name: BACKUP_MAX_SIZE_MB
              value: {{ .Values.backupManager.env.BACKUP_MAX_SIZE_MB | quote }}
            {{- if .Values.backupManager.env.BACKUP_SCHEDULE }}
            - name: BACKUP_SCHEDULE
              value: {{ .Values.backupManager.env.BACKUP_SCHEDULE | quote }}
            {{- end }}
            - name: SPRING_TASK_SCHEDULING_ENABLED
              value: {{ .Values.backupManager.env.SPRING_TASK_SCHEDULING_ENABLED | default "true" | quote }}
            - name: VOLUME_NAME
              value: {{ .Values.backupManager.env.VOLUME_NAME | quote }}
            - name: ALERTS_BACKUP_SUCCESS
              value: {{ .Values.backupManager.env.ALERTS_BACKUP_SUCCESS | quote }}
            - name: ALERTS_BACKUP_FAILURE
              value: {{ .Values.backupManager.env.ALERTS_BACKUP_FAILURE | quote }}
            - name: ALERT_MANAGER_URL
              value: "http://{{ include "omcsi.alertManagerHost" . }}:{{ .Values.alertManager.service.port }}/api/alerts"
          resources:
            {{- toYaml .Values.backupManager.resources | nindent 12 }}
          volumeMounts:
            - name: mcserver
              mountPath: /mcserver
              readOnly: true
            - name: backups
              mountPath: {{ .Values.backupManager.env.BACKUP_DIRECTORY | quote }}
      volumes:
        - name: mcserver
          {{- if .Values.persistence.mcserver.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-mcserver
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: backups
          {{- if .Values.persistence.backups.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-backups
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.backupManagerHost" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 4 }}
spec:
  type: {{ .Values.backupManager.service.type }}
  ports:
    - port: {{ .Values.backupManager.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "backup-manager") | nindent 4 }}
