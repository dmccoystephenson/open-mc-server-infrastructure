apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omcsi.fullname" . }}-nginx
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 4 }}
spec:
  {{- if not .Values.nginx.autoscaling.enabled }}
  replicas: {{ .Values.nginx.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "omcsi.labels" . | nindent 8 }}
        {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nginx.tls.selfSigned }}
      initContainers:
        - name: generate-tls
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              if [ ! -f /etc/nginx/ssl/cert.pem ] || [ ! -f /etc/nginx/ssl/key.pem ]; then
                openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                  -keyout /etc/nginx/ssl/key.pem \
                  -out /etc/nginx/ssl/cert.pem \
                  -subj "/C=US/ST=State/L=City/O=Organization/CN=localhost"
              fi
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/ssl
            - name: nginx-tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          {{- with .Values.nginx.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/nginx/ssl
              {{- if not .Values.nginx.tls.selfSigned }}
              readOnly: true
              {{- end }}
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "omcsi.fullname" . }}-nginx-config
        {{- if .Values.nginx.tls.selfSigned }}
        - name: tls
          emptyDir: {}
        {{- else }}
        - name: tls
          secret:
            secretName: {{ include "omcsi.fullname" . }}-nginx-tls
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
        {{- end }}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.fullname" . }}-nginx
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.nginx.service.type "NodePort") .Values.nginx.service.httpNodePort }}
      nodePort: {{ .Values.nginx.service.httpNodePort }}
      {{- end }}
    - port: {{ .Values.nginx.service.httpsPort }}
      targetPort: https
      protocol: TCP
      name: https
      {{- if and (eq .Values.nginx.service.type "NodePort") .Values.nginx.service.httpsNodePort }}
      nodePort: {{ .Values.nginx.service.httpsNodePort }}
      {{- end }}
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "nginx") | nindent 4 }}
