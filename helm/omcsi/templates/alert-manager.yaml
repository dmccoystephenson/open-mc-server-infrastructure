apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omcsi.fullname" . }}-alert-manager
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 4 }}
spec:
  replicas: {{ .Values.alertManager.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omcsi.labels" . | nindent 8 }}
        {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne "false" (toString ((.Values.postgres).enabled)) }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              attempt=0
              until pg_isready -h {{ include "omcsi.fullname" . }}-postgres -U {{ .Values.postgres.username | quote }} -d {{ .Values.postgres.database | quote }}; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "ERROR: postgres did not become ready after $attempt attempts."
                  exit 1
                fi
                echo "Waiting for postgres (attempt $attempt/60)..."
                sleep 5
              done
              echo "postgres is ready"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: alert-manager
          image: "{{ .Values.alertManager.image.repository }}:{{ .Values.alertManager.image.tag }}"
          imagePullPolicy: {{ .Values.alertManager.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: DISCORD_WEBHOOK_URL
            - name: DISCORD_ENABLED
              value: {{ .Values.alertManager.env.DISCORD_ENABLED | quote }}
            - name: MINECRAFT_RCON_HOST
              value: "{{ include "omcsi.minecraftWrapperHost" . }}-internal"
            - name: MINECRAFT_RCON_PORT
              value: {{ .Values.minecraftWrapper.internalService.rconPort | quote }}
            - name: MINECRAFT_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: RCON_PASSWORD
            - name: MINECRAFT_RCON_ENABLED
              value: {{ .Values.alertManager.env.MINECRAFT_RCON_ENABLED | quote }}
            {{- if ne "false" (toString ((.Values.postgres).enabled)) }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "omcsi.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omcsi.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.alertManager.resources | nindent 12 }}
          volumeMounts:
            - name: alert-manager-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: alert-manager-data
          {{- if .Values.persistence.alertManagerData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omcsi.fullname" . }}-alert-manager-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omcsi.alertManagerHost" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 4 }}
    {{- if ne "false" (toString ((.Values.monitoring).enabled)) }}
    omcsi.io/metrics: "true"
    {{- end }}
spec:
  type: {{ .Values.alertManager.service.type }}
  ports:
    - port: {{ .Values.alertManager.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "omcsi.selectorLabels" (dict "root" . "component" "alert-manager") | nindent 4 }}
