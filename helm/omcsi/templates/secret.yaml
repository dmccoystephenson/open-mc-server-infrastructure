apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omcsi.secretName" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
type: Opaque
stringData:
  RCON_PASSWORD: {{ required "secrets.rconPassword is required" .Values.secrets.rconPassword | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  DEPLOY_AUTH_TOKEN: {{ .Values.secrets.deployAuthToken | quote }}
  DEPLOYMENT_AUTH_TOKEN: {{ .Values.secrets.deploymentAuthToken | quote }}
  DISCORD_WEBHOOK_URL: {{ .Values.secrets.discordWebhookUrl | quote }}
  AGENT_DISCORD_BOT_TOKEN: {{ .Values.secrets.agentDiscordBotToken | quote }}
  AGENT_DISCORD_CHANNEL_ID: {{ .Values.secrets.agentDiscordChannelId | quote }}
  AGENT_ANTHROPIC_API_KEY: {{ .Values.secrets.agentAnthropicApiKey | quote }}
