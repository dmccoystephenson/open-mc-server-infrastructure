apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omcsi.secretName" . }}
  labels:
    {{- include "omcsi.labels" . | nindent 4 }}
type: Opaque
stringData:
  RCON_PASSWORD: {{ required "secrets.rconPassword is required" .Values.secrets.rconPassword | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  DEPLOY_AUTH_TOKEN: {{ .Values.secrets.deployAuthToken | quote }}
  DEPLOYMENT_AUTH_TOKEN: {{ .Values.secrets.deploymentAuthToken | quote }}
  DISCORD_WEBHOOK_URL: {{ .Values.secrets.discordWebhookUrl | quote }}
  AGENT_DISCORD_BOT_TOKEN: {{ if .Values.agentManager.enabled }}{{ required "secrets.agentDiscordBotToken is required when agentManager is enabled" .Values.secrets.agentDiscordBotToken | quote }}{{ else }}{{ .Values.secrets.agentDiscordBotToken | quote }}{{ end }}
  AGENT_DISCORD_CHANNEL_ID: {{ if .Values.agentManager.enabled }}{{ required "secrets.agentDiscordChannelId is required when agentManager is enabled" .Values.secrets.agentDiscordChannelId | quote }}{{ else }}{{ .Values.secrets.agentDiscordChannelId | quote }}{{ end }}
  AGENT_ANTHROPIC_API_KEY: {{ if .Values.agentManager.enabled }}{{ required "secrets.agentAnthropicApiKey is required when agentManager is enabled" .Values.secrets.agentAnthropicApiKey | quote }}{{ else }}{{ .Values.secrets.agentAnthropicApiKey | quote }}{{ end }}
