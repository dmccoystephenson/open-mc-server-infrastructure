# Application name
spring.application.name=agent-manager

# Server port
server.port=8093

# Anthropic API configuration
anthropic.api.key=${AGENT_ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514

# Discord bot configuration
discord.bot.token=${AGENT_DISCORD_BOT_TOKEN:}
discord.channel.id=${AGENT_DISCORD_CHANNEL_ID:}

# Minecraft wrapper configuration
minecraft.wrapper.url=${MINECRAFT_WRAPPER_URL:http://minecraft-wrapper:8092}

# Backup manager configuration
backup.manager.url=${BACKUP_MANAGER_URL:http://backup-manager:8091}

# Alert manager configuration
alert.manager.url=${ALERT_MANAGER_URL:http://alert-manager:8090/api/alerts}

# Agent enabled flag
agent.enabled=${AGENT_ENABLED:false}

# Per-tool confirmation toggles
agent.start-server.requires-confirmation=${AGENT_START_SERVER_REQUIRES_CONFIRMATION:true}
agent.stop-server.requires-confirmation=${AGENT_STOP_SERVER_REQUIRES_CONFIRMATION:true}
agent.restart-server.requires-confirmation=${AGENT_RESTART_SERVER_REQUIRES_CONFIRMATION:true}
agent.trigger-backup.requires-confirmation=${AGENT_TRIGGER_BACKUP_REQUIRES_CONFIRMATION:true}

# Role-based access control — Discord role IDs for each permission tier
# Leave blank to disable that tier (users without any matching role are treated as Unrecognized)
agent.role.admin.id=${AGENT_ADMIN_ROLE_ID:}
agent.role.moderator.id=${AGENT_MODERATOR_ROLE_ID:}
agent.role.member.id=${AGENT_MEMBER_ROLE_ID:}

# Comma-separated list of tool names accessible to ALL users regardless of role
# (including unrecognized users). Leave blank to keep all tools role-gated.
# Example: agent.public.tools=get_server_status,get_server_metrics
agent.public.tools=${AGENT_PUBLIC_TOOLS:}

# HTTP client timeouts (in seconds)
http.client.connect-timeout-seconds=5
http.client.read-timeout-seconds=30

# Backup operations can take 5-10 minutes; use a longer read timeout
backup.manager.read-timeout-seconds=600

# Diagnostic log inclusion (disabled by default to protect player privacy)
# Requires logs.diagnostic.enabled=true on the minecraft-wrapper side as well
diagnostics.logs.enabled=${DIAGNOSTICS_LOGS_ENABLED:false}
diagnostics.logs.max-lines=${DIAGNOSTICS_LOGS_MAX_LINES:500}
# When true (default), IP addresses in server logs are redacted to [IP_REDACTED] before being sent to Anthropic
diagnostics.logs.anonymize=${DIAGNOSTICS_LOGS_ANONYMIZE:true}

# Webapp data inclusion in diagnostics (disabled by default)
# When enabled, the agent will call the webapp's /api/status and /api/activity-tracker/stats endpoints
diagnostics.webapp.enabled=${DIAGNOSTICS_WEBAPP_ENABLED:false}
webapp.url=${WEBAPP_URL:http://webapp:8080}

# Actuator configuration for health checks and dynamic log management
management.endpoints.web.exposure.include=health,loggers
management.endpoint.health.show-details=always
management.server.port=8094
management.server.address=127.0.0.1

# Logging configuration
logging.level.com.openmc.agentmanager=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
