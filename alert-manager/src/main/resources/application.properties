# Application name
spring.application.name=alert-manager

# Server port
server.port=8090

# Discord webhook configuration
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
discord.enabled=${DISCORD_ENABLED:false}

# Minecraft RCON configuration
minecraft.rcon.host=${MINECRAFT_RCON_HOST:mcserver}
minecraft.rcon.port=${MINECRAFT_RCON_PORT:25575}
minecraft.rcon.password=${MINECRAFT_RCON_PASSWORD:}
minecraft.rcon.enabled=${MINECRAFT_RCON_ENABLED:false}

# HTTP client timeouts (in seconds)
http.client.connect-timeout-seconds=5
http.client.read-timeout-seconds=5

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.openmc.alertmanager=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Rate limiting configuration
alert.rate-limit.enabled=${ALERT_RATE_LIMIT_ENABLED:true}
alert.rate-limit.max-alerts=${ALERT_RATE_LIMIT_MAX_ALERTS:10}
alert.rate-limit.time-window-seconds=${ALERT_RATE_LIMIT_WINDOW_SECONDS:60}
