services:
  mcserver:
    build:
      context: .
      args:
        - MINECRAFT_VERSION=${MINECRAFT_VERSION}
    image: open-mc-server
    restart: always
    container_name: ${CONTAINER_NAME:-open-mc-server}
    stop_grace_period: 45s
    ports:
      - "${HOST_PORT:-25565}:25565"
      - "${HOST_RCON_PORT:-25575}:25575"
      - "${HOST_BLUEMAP_PORT:-8100}:8100"
    volumes:
      - mcserver:/mcserver
      - ./deposit-box:/deposit-box
    depends_on:
      alert-manager:
        condition: service_healthy
    environment:
      - MINECRAFT_VERSION=${MINECRAFT_VERSION}
      - OPERATOR_UUID=${OPERATOR_UUID}
      - OPERATOR_NAME=${OPERATOR_NAME}
      - OPERATOR_LEVEL=${OPERATOR_LEVEL}
      - OVERWRITE_EXISTING_SERVER=${OVERWRITE_EXISTING_SERVER}
      - SERVER_MOTD=${SERVER_MOTD}
      - MAX_PLAYERS=${MAX_PLAYERS}
      - DIFFICULTY=${DIFFICULTY}
      - GAMEMODE=${GAMEMODE}
      - PVP_ENABLED=${PVP_ENABLED}
      - ONLINE_MODE=${ONLINE_MODE}
      - JAVA_OPTS=${JAVA_OPTS}
      - RCON_PASSWORD=${RCON_PASSWORD:-minecraft}
      # Alert configuration
      - ALERT_MANAGER_URL=${ALERT_MANAGER_URL:-}
      - ALERTS_SERVER_START=${ALERTS_SERVER_START:-true}
      - ALERTS_SERVER_STOP=${ALERTS_SERVER_STOP:-true}
      - ALERTS_SERVER_CRASH=${ALERTS_SERVER_CRASH:-true}
      - ALERTS_CONFIG_WARNING=${ALERTS_CONFIG_WARNING:-false}

  webapp:
    build:
      context: ./web-app
    image: open-mc-server-webapp
    restart: always
    container_name: ${WEB_CONTAINER_NAME:-open-mc-webapp}
    expose:
      - "8080"
    volumes:
      - webapp-data:/app/data
    depends_on:
      - mcserver
    environment:
      - MC_HOST=mcserver
      - MC_RCON_PORT=25575
      - MC_RCON_PASSWORD=${RCON_PASSWORD:-minecraft}
      - MC_MOTD=${SERVER_MOTD}
      - MC_MAX_PLAYERS=${MAX_PLAYERS}
      - DYNMAP_URL=${DYNMAP_URL:-}
      - BLUEMAP_URL=${BLUEMAP_URL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - WEB_REFRESH_INTERVAL_MS=${WEB_REFRESH_INTERVAL_MS:-1800000}
      - ACTIVITY_TRACKER_URL=${ACTIVITY_TRACKER_URL:-}
      - ACTIVITY_TRACKER_ENABLED=${ACTIVITY_TRACKER_ENABLED:-false}
      - DASHBOARD_TITLE=${DASHBOARD_TITLE:-Minecraft Server Dashboard}
      - DASHBOARD_SUBTITLE=${DASHBOARD_SUBTITLE:-Server Management & Information}
      - DASHBOARD_PRIMARY_COLOR=${DASHBOARD_PRIMARY_COLOR:-#667eea}
      - DASHBOARD_SECONDARY_COLOR=${DASHBOARD_SECONDARY_COLOR:-#764ba2}
      - DATA_STORAGE_PATH=${DATA_STORAGE_PATH:-/app/data}

  nginx:
    build:
      context: ./nginx
    image: open-mc-server-nginx
    restart: always
    container_name: ${NGINX_CONTAINER_NAME:-open-mc-nginx}
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    depends_on:
      - webapp
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl

  backup-manager:
    build:
      context: ./backup-manager
    image: open-mc-server-backup-manager
    restart: always
    container_name: ${BACKUP_CONTAINER_NAME:-open-mc-backup-manager}
    ports:
      - "${BACKUP_PORT:-8091}:8091"
    volumes:
      - mcserver:/mcserver:ro
      - ./backups:/backups
      - ./.env:/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      alert-manager:
        condition: service_healthy
    environment:
      - BACKUP_DIRECTORY=/backups
      - HOST_BACKUP_DIRECTORY=${PWD}/backups
      - BACKUP_MAX_SIZE_MB=${BACKUP_MAX_SIZE_MB:-10240}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 0 2 * * ?}
      - VOLUME_NAME=${VOLUME_NAME:-mcserver}
      # Alert configuration
      - ALERTS_BACKUP_SUCCESS=${ALERTS_BACKUP_SUCCESS:-true}
      - ALERTS_BACKUP_FAILURE=${ALERTS_BACKUP_FAILURE:-true}

  alert-manager:
    build:
      context: ./alert-manager
    image: open-mc-server-alert-manager
    restart: always
    container_name: ${ALERT_CONTAINER_NAME:-open-mc-alert-manager}
    ports:
      - "${ALERT_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_ENABLED=${DISCORD_ENABLED:-false}
      - MINECRAFT_RCON_HOST=${MINECRAFT_RCON_HOST:-mcserver}
      - MINECRAFT_RCON_PORT=${MINECRAFT_RCON_PORT:-25575}
      - MINECRAFT_RCON_PASSWORD=${RCON_PASSWORD:-minecraft}
      - MINECRAFT_RCON_ENABLED=${MINECRAFT_RCON_ENABLED:-true}

  upgrade-manager:
    build:
      context: ./upgrade-manager
    image: open-mc-server-upgrade-manager
    restart: always
    container_name: ${UPGRADE_CONTAINER_NAME:-open-mc-upgrade-manager}
    ports:
      - "${UPGRADE_PORT:-8092}:8092"
    volumes:
      - ./.env:/.env
      - ./backups:/backups
      - ./up.sh:/up.sh:ro
      - ./down.sh:/down.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      alert-manager:
        condition: service_healthy
      backup-manager:
        condition: service_started
    environment:
      - ENV_FILE_PATH=/.env
      - BACKUP_DIRECTORY=/backups
      - BACKUP_MANAGER_URL=http://backup-manager:8091/api/backups/trigger
      - CONTAINER_NAME=${CONTAINER_NAME:-open-mc-server}
      - ALERT_MANAGER_URL=http://alert-manager:8090/api/alerts
      # Alert configuration
      - ALERTS_UPGRADE_START=${ALERTS_UPGRADE_START:-true}
      - ALERTS_UPGRADE_COMPLETE=${ALERTS_UPGRADE_COMPLETE:-true}
      - ALERTS_UPGRADE_FAILURE=${ALERTS_UPGRADE_FAILURE:-true}
      - ALERTS_VERSION_CHECK=${ALERTS_VERSION_CHECK:-true}
      # Version check configuration
      - VERSION_CHECK_ENABLED=${VERSION_CHECK_ENABLED:-true}
      - VERSION_CHECK_SCHEDULE=${VERSION_CHECK_SCHEDULE:-0 0 3 * * ?}

volumes:
  mcserver:
    name: ${VOLUME_NAME:-mcserver}
    external: false
  webapp-data:
    name: ${WEBAPP_VOLUME_NAME:-webapp-data}
    external: false
