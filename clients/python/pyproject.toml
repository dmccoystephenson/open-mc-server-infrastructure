[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omcsi-client"
version = "0.1.0"
description = "Standard-library Python client for Open Minecraft Server Infrastructure (OMCSI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daniel McCoy Stephenson", email = "dmccoystephenson@gmail.com" }]
keywords = ["minecraft", "omcsi", "server-management", "api-client", "self-hosting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
# No runtime dependencies, deliberately: OMCSI is driven from operator shells
# and CI jobs where installing a dependency tree is more friction than the
# request being made. urllib is enough for a handful of JSON and multipart calls.
dependencies = []

[project.urls]
Homepage = "https://github.com/Stephenson-Software/open-mc-server-infrastructure"
Repository = "https://github.com/Stephenson-Software/open-mc-server-infrastructure"
Issues = "https://github.com/Stephenson-Software/open-mc-server-infrastructure/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omcsi_client = ["py.typed"]
