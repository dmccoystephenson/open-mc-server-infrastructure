# Upgrade Manager Configuration

# Path to .env file
env.file.path=${ENV_FILE_PATH:/.env}

# Directory where backups are stored
backup.directory=${BACKUP_DIRECTORY:/backups}

# Backup Manager URL for triggering backups
backup.manager.url=${BACKUP_MANAGER_URL:http://backup-manager:8091/api/backups/trigger}

# Container name for the Minecraft server
container.name=${CONTAINER_NAME:open-mc-server}

# Alert Manager URL for sending notifications
alert.manager.url=${ALERT_MANAGER_URL:http://alert-manager:8090/api/alerts}

# Alert toggles
alerts.upgrade.start=${ALERTS_UPGRADE_START:true}
alerts.upgrade.complete=${ALERTS_UPGRADE_COMPLETE:true}
alerts.upgrade.failure=${ALERTS_UPGRADE_FAILURE:true}
alerts.version.check=${ALERTS_VERSION_CHECK:true}

# Version check configuration
version.check.enabled=${VERSION_CHECK_ENABLED:true}
version.check.schedule=${VERSION_CHECK_SCHEDULE:0 0 3 * * ?}

# Spring Boot Configuration
spring.application.name=upgrade-manager
server.port=${UPGRADE_PORT:8092}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.openmc.upgrademanager=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
