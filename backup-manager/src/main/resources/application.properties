# Backup Manager Configuration

# Directory where backups are stored
# Can be overridden with BACKUP_DIRECTORY environment variable
backup.directory=${BACKUP_DIRECTORY:/backups}

# Maximum size of the backups directory in MB (default: 10GB)
# Can be overridden with BACKUP_MAX_SIZE_MB environment variable
backup.max.size.mb=${BACKUP_MAX_SIZE_MB:10240}

# Backup schedule (cron expression)
# Default: 0 0 2 * * ? (2 AM every day)
# Can be overridden with BACKUP_SCHEDULE environment variable
backup.schedule=${BACKUP_SCHEDULE:0 0 2 * * ?}

# Docker volume name containing Minecraft server data
# Can be overridden with VOLUME_NAME environment variable
volume.name=${VOLUME_NAME:mcserver}

# Alert Manager URL for sending notifications
# Can be overridden with ALERT_MANAGER_URL environment variable
alert.manager.url=${ALERT_MANAGER_URL:http://alert-manager:8090/api/alerts}

# Host backup directory (used when running in container with Docker socket)
# Can be overridden with HOST_BACKUP_DIRECTORY environment variable
host.backup.directory=${HOST_BACKUP_DIRECTORY:}

# Alert toggles
alerts.backup.success=${ALERTS_BACKUP_SUCCESS:true}
alerts.backup.failure=${ALERTS_BACKUP_FAILURE:true}

# Spring Boot Configuration
spring.application.name=backup-manager
server.port=${BACKUP_PORT:8091}

# Logging configuration
logging.level.com.openmc.backupmanager=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
