# Server Configuration
server.port=8080

# Minecraft Server Configuration
minecraft.server.host=${MC_HOST:minecraft-wrapper}
minecraft.server.rcon-port=${MC_RCON_PORT:25575}
minecraft.server.rcon-password=${MC_RCON_PASSWORD:minecraft}
minecraft.server.motd=${MC_MOTD:An Open Minecraft Server}
minecraft.server.max-players=${MC_MAX_PLAYERS:20}

# External Service URLs
minecraft.server.dynmap-url=${DYNMAP_URL:}
minecraft.server.bluemap-url=${BLUEMAP_URL:}
minecraft.server.accordion-chat-url=${ACCORDION_CHAT_URL:}

# Admin Credentials
minecraft.server.admin-username=${ADMIN_USERNAME:admin}
minecraft.server.admin-password=${ADMIN_PASSWORD:admin}

# Web App Settings
minecraft.server.refresh-interval-ms=${WEB_REFRESH_INTERVAL_MS:1800000}

# Activity Tracker Integration
minecraft.server.activity-tracker-url=${ACTIVITY_TRACKER_URL:}
minecraft.server.activity-tracker-enabled=${ACTIVITY_TRACKER_ENABLED:false}

# Dashboard Customization
minecraft.server.dashboard-title=${DASHBOARD_TITLE:Minecraft Server Dashboard}
minecraft.server.dashboard-subtitle=${DASHBOARD_SUBTITLE:Server Management & Information}
minecraft.server.dashboard-primary-color=${DASHBOARD_PRIMARY_COLOR:#667eea}
minecraft.server.dashboard-secondary-color=${DASHBOARD_SECONDARY_COLOR:#764ba2}
minecraft.server.dashboard-dark-mode=${DASHBOARD_DARK_MODE:true}

# Plugin Directory
minecraft.server.plugins-directory=${PLUGINS_DIRECTORY:/mcserver/plugins}

# Alert Manager Configuration
alert.manager.url=${ALERT_MANAGER_URL:http://alert-manager:8090}
alert.manager.enabled=${ALERT_MANAGER_ENABLED:true}

# Minecraft Wrapper Configuration
minecraft.wrapper.url=${MINECRAFT_WRAPPER_URL:http://minecraft-wrapper:8092}
minecraft.wrapper.enabled=${MINECRAFT_WRAPPER_ENABLED:true}

# File Upload Limits
spring.servlet.multipart.max-file-size=${MAX_FILE_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_UPLOAD_SIZE:100MB}

# Data Storage Configuration
data.storage.base-directory=${DATA_STORAGE_PATH:/app/data}

# Deployment History
deployment.auth.token=${DEPLOYMENT_AUTH_TOKEN:}

# Logging
logging.level.com.openmc.webapp=INFO
