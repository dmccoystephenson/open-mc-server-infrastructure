<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile != null ? profile.playerName + ' - Player Profile' : 'Player Not Found'}">Player Profile</title>
    <style>
        :root {
            --primary-color: /*[[${dashboardPrimaryColor}]]*/ #667eea;
            --secondary-color: /*[[${dashboardSecondaryColor}]]*/ #764ba2;
            --gradient-bg: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            .header p {
                font-size: 1em;
            }
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .player-name {
            font-size: 2.5em;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .player-uuid {
            font-size: 0.9em;
            color: #6b7280;
            font-family: 'Courier New', monospace;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }
        
        .rank-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .rank-badge.gold {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
        }
        
        .rank-badge.silver {
            background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 100%);
            color: white;
        }
        
        .rank-badge.bronze {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
        }
        
        .rank-badge.default {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1em;
            text-align: center;
        }
        
        .btn-primary {
            background: var(--gradient-bg);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .error-message {
            text-align: center;
            padding: 40px;
            color: #ef4444;
            font-size: 1.2em;
        }
        
        .error-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Player Profile</h1>
        </div>
        
        <div class="card" th:if="${profile != null}">
            <div class="profile-header">
                <div class="player-name" th:text="${profile.playerName}">PlayerName</div>
                <div class="player-uuid" th:text="${profile.playerUuid}">UUID</div>
                <div th:if="${profile.leaderboardRank <= 3}">
                    <span th:class="${profile.leaderboardRank == 1 ? 'rank-badge gold' : (profile.leaderboardRank == 2 ? 'rank-badge silver' : 'rank-badge bronze')}">
                        <span th:if="${profile.leaderboardRank == 1}">🥇 #1</span>
                        <span th:if="${profile.leaderboardRank == 2}">🥈 #2</span>
                        <span th:if="${profile.leaderboardRank == 3}">🥉 #3</span>
                    </span>
                </div>
                <div th:if="${profile.leaderboardRank > 3}">
                    <span class="rank-badge default" th:text="'Rank #' + ${profile.leaderboardRank}">Rank #4</span>
                </div>
            </div>
            
            <h2>📊 Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" th:text="${#numbers.formatDecimal(profile.hoursPlayed, 1, 1)}">0.0</div>
                    <div class="stat-label">Hours Played</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" th:text="${profile.totalLogins}">0</div>
                    <div class="stat-label">Total Logins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" th:text="${profile.leaderboardRank}">0</div>
                    <div class="stat-label">Leaderboard Rank</div>
                </div>
            </div>
            
            <div class="nav-buttons">
                <a href="/public" class="btn btn-primary">← Back to Dashboard</a>
                <a href="/admin" class="btn btn-secondary">Admin Console</a>
            </div>
        </div>
        
        <div class="card" th:if="${profile == null}">
            <div class="error-message">
                <div class="error-icon">❌</div>
                <div th:text="${error}">Player not found</div>
                <p style="margin-top: 10px; font-size: 0.9em; color: #6b7280;">
                    This player may not have any recorded activity yet.
                </p>
            </div>
            <div class="nav-buttons">
                <a href="/public" class="btn btn-primary">← Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
