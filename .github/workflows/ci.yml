name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Code and Configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Validate shell scripts
      run: |
        echo "🔍 Validating shell script syntax..."
        bash -n up.sh
        bash -n down.sh
        bash -n upgrade.sh
        bash -n trigger-backup.sh
        bash -n resources/post-create.sh
        
        echo "🔍 Running ShellCheck linter..."
        shellcheck up.sh down.sh upgrade.sh trigger-backup.sh resources/post-create.sh scripts/*.sh
        
    - name: Validate Docker configuration
      run: |
        echo "🐳 Validating Dockerfile..."
        test -f Dockerfile
        grep -q "FROM" Dockerfile
        
        echo "🐳 Validating Docker Compose configuration..."
        cp sample.env .env
        sed -i 's/YOUR_UUID_HERE/test-uuid-1234/g' .env
        sed -i 's/YOUR_USERNAME_HERE/TestPlayer/g' .env
        docker compose config > /dev/null
        rm .env
        
        echo "🐳 Testing Docker build..."
        docker build --target base -t minecraft-server-test .
        
    - name: Validate environment configuration
      run: |
        echo "⚙️ Validating sample.env format..."
        test -f sample.env
        grep -q "MINECRAFT_VERSION=" sample.env
        grep -q "OPERATOR_UUID=" sample.env
        grep -q "OPERATOR_NAME=" sample.env
        grep -q "SERVER_MOTD=" sample.env
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Build web application
      run: |
        echo "🌐 Building web application..."
        cd web-app
        ./gradlew build
        echo "✓ Web application built successfully"
        ls -lh build/libs/
        
    - name: Run web application tests
      run: |
        echo "🧪 Running web application tests..."
        cd web-app
        ./gradlew test
        echo "✓ All tests passed"
        
    - name: Build minecraft-wrapper module
      run: |
        echo "🎮 Building minecraft-wrapper module..."
        cd minecraft-wrapper
        ./gradlew build
        echo "✓ Minecraft wrapper built successfully"
        ls -lh build/libs/
        
    - name: Run minecraft-wrapper tests
      run: |
        echo "🧪 Running minecraft-wrapper tests..."
        cd minecraft-wrapper
        ./gradlew test
        echo "✓ All tests passed"
        
    - name: Build agent-manager module
      run: |
        echo "🤖 Building agent-manager module..."
        cd agent-manager
        ./gradlew build
        echo "✓ Agent manager built successfully"
        ls -lh build/libs/
        
    - name: Run agent-manager tests
      run: |
        echo "🧪 Running agent-manager tests..."
        cd agent-manager
        ./gradlew test
        echo "✓ All tests passed"
        
    - name: Validate documentation
      run: |
        echo "📚 Validating documentation..."
        test -f README.md
        grep -q "# Open Minecraft Server Infrastructure" README.md  
        test -f LICENSE

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.17.0'

    - name: Lint Helm chart
      run: |
        echo "⎈ Linting Helm chart..."
        helm lint helm/omcsi --set secrets.rconPassword=ci --set secrets.adminPassword=ci
        echo "✓ Helm chart linted successfully"
        
  helm-deploy-test:
    name: Helm Deploy Smoke Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.17.0'

    - name: Create kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: omcsi-ci

    - name: Install Helm chart
      run: |
        echo "⎈ Installing OMCSI Helm chart into kind cluster..."
        # --wait=false because the container images are not built/loaded into the
        # kind cluster.  The test validates the chart produces valid Kubernetes
        # API objects (Deployments, Services, PVCs, etc.) beyond what
        # `helm lint` checks, not that the applications start.  Using --wait
        # would require building all images and loading them into kind, which is
        # out of scope for this smoke test.
        helm install omcsi ./helm/omcsi \
          --set secrets.rconPassword=ci-test-rcon \
          --set secrets.adminPassword=ci-test-admin \
          --wait=false \
          --timeout 60s
        echo "✓ Helm install completed"

    - name: Verify Deployments
      run: |
        echo "🔍 Verifying Deployments..."
        for dep in minecraft-wrapper webapp nginx backup-manager alert-manager; do
          kubectl get deployment "omcsi-${dep}" -o name
          echo "  ✓ Deployment omcsi-${dep} exists"
        done

    - name: Verify Services
      run: |
        echo "🔍 Verifying Services..."
        for svc in minecraft-wrapper minecraft-wrapper-internal webapp nginx backup-manager alert-manager; do
          kubectl get service "omcsi-${svc}" -o name
          echo "  ✓ Service omcsi-${svc} exists"
        done

    - name: Verify PVCs
      run: |
        echo "🔍 Verifying PersistentVolumeClaims..."
        for pvc in mcserver webapp-data alert-manager-data backups; do
          kubectl get pvc "omcsi-${pvc}" -o name
          echo "  ✓ PVC omcsi-${pvc} exists"
        done

    - name: Verify Secret and ConfigMap
      run: |
        echo "🔍 Verifying Secret..."
        kubectl get secret omcsi-secrets -o name
        echo "  ✓ Secret omcsi-secrets exists"

        echo "🔍 Verifying ConfigMap..."
        kubectl get configmap omcsi-nginx-config -o name
        echo "  ✓ ConfigMap omcsi-nginx-config exists"

    - name: Verify Service types and ports
      run: |
        echo "🔍 Verifying Service specs..."

        # Minecraft external service should be NodePort
        MC_TYPE=$(kubectl get svc omcsi-minecraft-wrapper -o jsonpath='{.spec.type}')
        echo "  minecraft-wrapper type: ${MC_TYPE}"
        [ "${MC_TYPE}" = "NodePort" ] || { echo "FAIL: expected NodePort"; exit 1; }

        # Internal service should be ClusterIP
        INT_TYPE=$(kubectl get svc omcsi-minecraft-wrapper-internal -o jsonpath='{.spec.type}')
        echo "  minecraft-wrapper-internal type: ${INT_TYPE}"
        [ "${INT_TYPE}" = "ClusterIP" ] || { echo "FAIL: expected ClusterIP"; exit 1; }

        # Internal service should expose RCON port
        RCON_PORT=$(kubectl get svc omcsi-minecraft-wrapper-internal -o jsonpath='{.spec.ports[?(@.name=="rcon")].port}')
        echo "  RCON port: ${RCON_PORT}"
        [ "${RCON_PORT}" = "25575" ] || { echo "FAIL: expected RCON port 25575"; exit 1; }

        # Nginx service should be LoadBalancer
        NGINX_TYPE=$(kubectl get svc omcsi-nginx -o jsonpath='{.spec.type}')
        echo "  nginx type: ${NGINX_TYPE}"
        [ "${NGINX_TYPE}" = "LoadBalancer" ] || { echo "FAIL: expected LoadBalancer"; exit 1; }

        echo "  ✓ All Service specs verified"

    - name: Verify Helm release status
      run: |
        echo "⎈ Checking Helm release status..."
        helm list
        STATUS=$(helm status omcsi -o json | jq -r '.info.status')
        echo "  Release status: ${STATUS}"
        [ "${STATUS}" = "deployed" ] || { echo "FAIL: expected status 'deployed'"; exit 1; }
        echo "  ✓ Helm release is in 'deployed' state"

    - name: Cleanup
      if: always()
      run: |
        helm uninstall omcsi --ignore-not-found || true

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.9.0'

    - name: Terraform fmt check (Linode)
      run: |
        echo "🔍 Checking Terraform formatting (Linode)..."
        terraform -chdir=terraform/linode fmt -check -diff
        echo "✓ Linode Terraform files are properly formatted"

    - name: Terraform fmt check (AWS)
      run: |
        echo "🔍 Checking Terraform formatting (AWS)..."
        terraform -chdir=terraform/aws fmt -check -diff
        echo "✓ AWS Terraform files are properly formatted"

    - name: Terraform init (Linode)
      run: |
        echo "⚙️ Initializing Terraform (Linode)..."
        terraform -chdir=terraform/linode init -backend=false
        echo "✓ Linode Terraform initialized"

    - name: Terraform validate (Linode)
      run: |
        echo "✅ Validating Terraform configuration (Linode)..."
        terraform -chdir=terraform/linode validate
        echo "✓ Linode Terraform configuration is valid"

    - name: Terraform init (AWS)
      run: |
        echo "⚙️ Initializing Terraform (AWS)..."
        terraform -chdir=terraform/aws init -backend=false
        echo "✓ AWS Terraform initialized"

    - name: Terraform validate (AWS)
      run: |
        echo "✅ Validating Terraform configuration (AWS)..."
        terraform -chdir=terraform/aws validate
        echo "✓ AWS Terraform configuration is valid"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true