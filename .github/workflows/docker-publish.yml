name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'minecraft-wrapper/**'
      - 'resources/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft version to build (e.g. 26.1)'
        required: false
        default: '26.1'
      push_images:
        description: 'Push images to Docker Hub'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-open-mc-server:
    name: Build open-mc-server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Minecraft version
        id: mc_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.minecraft_version }}" >> "$GITHUB_OUTPUT"
          else
            # Extract default from Dockerfile ARG
            version=$(grep 'ARG MINECRAFT_VERSION=' Dockerfile | head -1 | cut -d= -f2)
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push open-mc-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: MINECRAFT_VERSION=${{ steps.mc_version.outputs.version }}
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true' }}
          tags: |
            dmccoystephenson/open-mc-server:latest
            dmccoystephenson/open-mc-server:${{ steps.mc_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildTools downloads Spigot source and compiles it — this takes ~20 minutes.
          # The GHA cache significantly reduces rebuild time on subsequent runs.

  build-supporting-images:
    name: Build supporting images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: open-mc-server-webapp
            context: web-app
            dockerfile: web-app/Dockerfile
          - name: open-mc-server-nginx
            context: nginx
            dockerfile: nginx/Dockerfile
          - name: open-mc-server-alert-manager
            context: alert-manager
            dockerfile: alert-manager/Dockerfile
          - name: open-mc-server-backup-manager
            context: backup-manager
            dockerfile: backup-manager/Dockerfile
          - name: open-mc-server-agent-manager
            context: agent-manager
            dockerfile: agent-manager/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true' }}
          tags: dmccoystephenson/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
