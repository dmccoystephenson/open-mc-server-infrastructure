name: Discord Notifications

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, ready_for_review, review_requested]
  push:
    branches:
      - main
      - develop
  release:
    types: [published, created]

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    if: secrets.DISCORD_WEBHOOK_URL != ''
    steps:
      - name: Send Discord notification for issue opened
        if: github.event_name == 'issues' && github.event.action == 'opened'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "🆕 Issue opened: #${{ github.event.issue.number }}"
          embed-description: |
            **${{ github.event.issue.title }}**
            
            ${{ github.event.issue.body }}
          embed-url: ${{ github.event.issue.html_url }}
          embed-author-name: ${{ github.event.issue.user.login }}
          embed-author-url: ${{ github.event.issue.user.html_url }}
          embed-author-icon-url: ${{ github.event.issue.user.avatar_url }}
          embed-color: 3066993
          embed-footer-text: "Repository: ${{ github.repository }}"
          embed-timestamp: ${{ github.event.issue.created_at }}

      - name: Send Discord notification for issue closed
        if: github.event_name == 'issues' && github.event.action == 'closed'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "✅ Issue closed: #${{ github.event.issue.number }}"
          embed-description: |
            **${{ github.event.issue.title }}**
            
            ${{ github.event.issue.body }}
          embed-url: ${{ github.event.issue.html_url }}
          embed-author-name: ${{ github.event.issue.user.login }}
          embed-author-url: ${{ github.event.issue.user.html_url }}
          embed-author-icon-url: ${{ github.event.issue.user.avatar_url }}
          embed-color: 5763719
          embed-footer-text: "Repository: ${{ github.repository }}"
          embed-timestamp: ${{ github.event.issue.updated_at }}

      - name: Send Discord notification for issue reopened
        if: github.event_name == 'issues' && github.event.action == 'reopened'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "🔄 Issue reopened: #${{ github.event.issue.number }}"
          embed-description: |
            **${{ github.event.issue.title }}**
            
            ${{ github.event.issue.body }}
          embed-url: ${{ github.event.issue.html_url }}
          embed-author-name: ${{ github.event.issue.user.login }}
          embed-author-url: ${{ github.event.issue.user.html_url }}
          embed-author-icon-url: ${{ github.event.issue.user.avatar_url }}
          embed-color: 15105570
          embed-footer-text: "Repository: ${{ github.repository }}"
          embed-timestamp: ${{ github.event.issue.updated_at }}

      - name: Send Discord notification for pull request opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "🔀 Pull Request opened: #${{ github.event.pull_request.number }}"
          embed-description: |
            **${{ github.event.pull_request.title }}**
            
            ${{ github.event.pull_request.body }}
          embed-url: ${{ github.event.pull_request.html_url }}
          embed-author-name: ${{ github.event.pull_request.user.login }}
          embed-author-url: ${{ github.event.pull_request.user.html_url }}
          embed-author-icon-url: ${{ github.event.pull_request.user.avatar_url }}
          embed-color: 3447003
          embed-footer-text: "Repository: ${{ github.repository }} | ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}"
          embed-timestamp: ${{ github.event.pull_request.created_at }}

      - name: Send Discord notification for pull request merged
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "✅ Pull Request merged: #${{ github.event.pull_request.number }}"
          embed-description: |
            **${{ github.event.pull_request.title }}**
            
            ${{ github.event.pull_request.body }}
          embed-url: ${{ github.event.pull_request.html_url }}
          embed-author-name: ${{ github.event.pull_request.user.login }}
          embed-author-url: ${{ github.event.pull_request.user.html_url }}
          embed-author-icon-url: ${{ github.event.pull_request.user.avatar_url }}
          embed-color: 5763719
          embed-footer-text: "Repository: ${{ github.repository }} | ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}"
          embed-timestamp: ${{ github.event.pull_request.merged_at }}

      - name: Send Discord notification for pull request closed without merge
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "❌ Pull Request closed: #${{ github.event.pull_request.number }}"
          embed-description: |
            **${{ github.event.pull_request.title }}**
            
            ${{ github.event.pull_request.body }}
          embed-url: ${{ github.event.pull_request.html_url }}
          embed-author-name: ${{ github.event.pull_request.user.login }}
          embed-author-url: ${{ github.event.pull_request.user.html_url }}
          embed-author-icon-url: ${{ github.event.pull_request.user.avatar_url }}
          embed-color: 15158332
          embed-footer-text: "Repository: ${{ github.repository }} | ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}"
          embed-timestamp: ${{ github.event.pull_request.updated_at }}

      - name: Send Discord notification for pull request reopened
        if: github.event_name == 'pull_request' && github.event.action == 'reopened'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "🔄 Pull Request reopened: #${{ github.event.pull_request.number }}"
          embed-description: |
            **${{ github.event.pull_request.title }}**
            
            ${{ github.event.pull_request.body }}
          embed-url: ${{ github.event.pull_request.html_url }}
          embed-author-name: ${{ github.event.pull_request.user.login }}
          embed-author-url: ${{ github.event.pull_request.user.html_url }}
          embed-author-icon-url: ${{ github.event.pull_request.user.avatar_url }}
          embed-color: 15105570
          embed-footer-text: "Repository: ${{ github.repository }} | ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}"
          embed-timestamp: ${{ github.event.pull_request.updated_at }}

      - name: Send Discord notification for pull request ready for review
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "👀 Pull Request ready for review: #${{ github.event.pull_request.number }}"
          embed-description: |
            **${{ github.event.pull_request.title }}**
            
            ${{ github.event.pull_request.body }}
          embed-url: ${{ github.event.pull_request.html_url }}
          embed-author-name: ${{ github.event.pull_request.user.login }}
          embed-author-url: ${{ github.event.pull_request.user.html_url }}
          embed-author-icon-url: ${{ github.event.pull_request.user.avatar_url }}
          embed-color: 10181046
          embed-footer-text: "Repository: ${{ github.repository }} | ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}"
          embed-timestamp: ${{ github.event.pull_request.updated_at }}

      - name: Send Discord notification for pull request review requested
        if: github.event_name == 'pull_request' && github.event.action == 'review_requested'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "📝 Pull Request review requested: #${{ github.event.pull_request.number }}"
          embed-description: |
            **${{ github.event.pull_request.title }}**
            
            ${{ github.event.pull_request.body }}
          embed-url: ${{ github.event.pull_request.html_url }}
          embed-author-name: ${{ github.event.pull_request.user.login }}
          embed-author-url: ${{ github.event.pull_request.user.html_url }}
          embed-author-icon-url: ${{ github.event.pull_request.user.avatar_url }}
          embed-color: 10181046
          embed-footer-text: "Repository: ${{ github.repository }} | ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}"
          embed-timestamp: ${{ github.event.pull_request.updated_at }}

      - name: Send Discord notification for push events
        if: github.event_name == 'push' && github.event.head_commit != null
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "📦 Push to ${{ github.ref_name }}"
          embed-description: |
            **Commit Message:**
            ${{ github.event.head_commit.message }}
          embed-url: ${{ github.event.compare }}
          embed-author-name: ${{ github.event.pusher.name }}
          embed-author-url: ${{ github.event.sender.html_url }}
          embed-author-icon-url: ${{ github.event.sender.avatar_url }}
          embed-color: 7506394
          embed-footer-text: "Repository: ${{ github.repository }}"
          embed-timestamp: ${{ github.event.head_commit.timestamp }}

      - name: Send Discord notification for release events
        if: github.event_name == 'release'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "🚀 Release ${{ github.event.action }}: ${{ github.event.release.tag_name }}"
          embed-description: |
            **${{ github.event.release.name }}**
            
            ${{ github.event.release.body }}
          embed-url: ${{ github.event.release.html_url }}
          embed-author-name: ${{ github.event.release.author.login }}
          embed-author-url: ${{ github.event.release.author.html_url }}
          embed-author-icon-url: ${{ github.event.release.author.avatar_url }}
          embed-color: 15844367
          embed-footer-text: "Repository: ${{ github.repository }}"
          embed-timestamp: ${{ github.event.release.published_at || github.event.release.created_at }}
