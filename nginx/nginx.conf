pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # File upload size limit. Substituted from NGINX_MAX_BODY_SIZE by
    # entrypoint.sh at startup. This is the effective cap for dashboard uploads
    # whenever it is lower than the web app's own multipart limit
    # (MAX_FILE_UPLOAD_SIZE), which it is by default.
    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # World upload/list/delete. Separated from the catch-all below because an
        # upload runs far longer than the 60s the rest of the dashboard needs, and
        # a multi-GB body must not be spooled to disk inside this container first.
        # proxy_send_timeout/proxy_read_timeout are substituted from
        # NGINX_UPLOAD_TIMEOUT by entrypoint.sh at startup.
        location /api/world/ {
            proxy_pass http://webapp:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s; # upload
            proxy_read_timeout 3600s; # upload
        }

        # Optional route fragments generated by entrypoint.sh at startup —
        # currently only BlueMap, from NGINX_BLUEMAP_ENABLED. A wildcard include
        # that matches no files is not an error in nginx, so this is a no-op when
        # no fragment has been written. The Helm chart renders the equivalent
        # location into its own ConfigMap instead and has no include line, which
        # is what entrypoint.sh keys off to decide whether to generate anything.
        include /etc/nginx/omcsi.d/*.conf;

        # Proxy settings
        location / {
            proxy_pass http://webapp:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
